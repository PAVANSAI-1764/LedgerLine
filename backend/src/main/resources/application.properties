spring.application.name=ledgerline-backend

# Database Connection Settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline}
spring.datasource.username=${DB_USERNAME:ledgerline_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA and Hibernate Validation
# validate ensures Hibernate only verifies existing tables match entity definitions and makes no schema modifications
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator Health Endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
# JWT Configuration
# 256-bit key secret configured with default fallback for local development
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}